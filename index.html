<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Destroyer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1c1c1e;
            border-radius: 28px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            border: 0.5px solid #2c2c2e;
            text-align: center;
        }
        h1 { color: #fff; font-size: 32px; margin-bottom: 8px; }
        .sub { color: #8e8e93; font-size: 15px; margin-bottom: 32px; }
        button {
            background: #34c759;
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .key {
            font-family: monospace;
            font-size: 16px;
            background: #0c0c0d;
            padding: 16px;
            border-radius: 14px;
            color: #34c759;
            border: 0.5px solid #2c2c2e;
            word-break: break-all;
            margin: 20px 0;
        }
        .box {
            background: #0c0c0d;
            border-radius: 16px;
            padding: 16px;
            margin: 20px 0;
            border: 0.5px solid #2c2c2e;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #0c0c0d;
            border: 0.5px solid #2c2c2e;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            margin: 10px 0;
        }
        .footer { margin-top: 24px; font-size: 12px; color: #5c5c62; }
        hr { border-color: #2c2c2e; margin: 20px 0; }
        .info { color: #8e8e93; font-size: 13px; margin-top: 16px; }
        .cooldown { color: #ff9f0a; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Omega Destroyer</h1>
        <div class="sub">Key System</div>

        <div id="mainContent">
            <div id="keyDisplay" style="display: none;">
                <div class="key" id="keyText"></div>
                <button onclick="copyKey()">Copy Key</button>
                <div class="info" id="expiryText"></div>
                <hr>
                <button onclick="location.href='/'">Back to Home</button>
            </div>
            <div id="normalContent">
                <div id="generateBox" class="box">
                    <p>Generate 6-hour key</p>
                    <button id="generateBtn">Generate Key</button>
                    <div id="cooldownMsg" class="cooldown" style="display: none;"></div>
                </div>
                <hr>
                <div class="box">
                    <p>Already have a key?</p>
                    <input type="text" id="existingKey" placeholder="Paste your key here">
                    <button id="validateBtn">Validate Key</button>
                </div>
                <div class="footer">Keys last 6 hours | 12 hour cooldown</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://omega-key.onrender.com';
        let currentToken = null;

        const urlPath = window.location.pathname;
        const tokenMatch = urlPath.match(/^\/_\/(.+)$/);

        if (tokenMatch) {
            currentToken = tokenMatch[1];
            localStorage.setItem('pendingToken', currentToken);
            document.getElementById('normalContent').style.display = 'block';
            document.getElementById('keyDisplay').style.display = 'none';
            window.history.replaceState({}, document.title, '/');
        }

        function getCooldownRemaining() {
            const end = localStorage.getItem('cooldownEnd');
            if (!end) return 0;
            const remaining = parseInt(end) - Date.now();
            if (remaining <= 0) {
                localStorage.removeItem('cooldownEnd');
                return 0;
            }
            return remaining;
        }

        function setCooldown(ms) {
            localStorage.setItem('cooldownEnd', Date.now() + ms);
        }

        function updateCooldownDisplay() {
            const remaining = getCooldownRemaining();
            const msgDiv = document.getElementById('cooldownMsg');
            const genBtn = document.getElementById('generateBtn');
            if (!msgDiv || !genBtn) return;
            
            if (remaining > 0) {
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                genBtn.disabled = true;
                msgDiv.style.display = 'block';
                msgDiv.innerHTML = `Cooldown: ${hours}h ${minutes}m until next key`;
            } else {
                genBtn.disabled = false;
                msgDiv.style.display = 'none';
            }
        }

        async function generateKey() {
            const remaining = getCooldownRemaining();
            if (remaining > 0) {
                alert(`Cooldown active. Wait ${Math.floor(remaining / 60000)} minutes.`);
                return;
            }

            let token = currentToken || localStorage.getItem('pendingToken');
            if (!token) {
                alert('No token found. Please run the Game Guardian script again.');
                return;
            }

            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';

            try {
                const res = await fetch(`${API_URL}/generate-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                const data = await res.json();

                if (res.status === 429) {
                    alert(data.error);
                    setCooldown(12 * 60 * 60 * 1000);
                    updateCooldownDisplay();
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Key';
                    return;
                }

                if (data.key) {
                    const expiryDate = new Date(data.expiresAt).toLocaleString();
                    document.getElementById('normalContent').style.display = 'none';
                    document.getElementById('keyDisplay').style.display = 'block';
                    document.getElementById('keyText').innerText = data.key;
                    document.getElementById('expiryText').innerText = 'Expires: ' + expiryDate;
                    setCooldown(12 * 60 * 60 * 1000);
                    localStorage.removeItem('pendingToken');
                    currentToken = null;
                } else {
                    alert(data.error || 'Failed to generate key');
                    generateBtn.disabled = false;
                    generateBtn.textContent = 'Generate Key';
                }
            } catch(err) {
                alert('Server error. Try again later.');
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate Key';
            }
        }

        async function validateKey() {
            const keyInput = document.getElementById('existingKey');
            const key = keyInput.value.trim();
            if (!key) {
                alert('Paste a key');
                return;
            }

            let deviceId = localStorage.getItem('deviceId');
            if (!deviceId) {
                deviceId = 'web_' + Math.random().toString(36).substr(2, 16);
                localStorage.setItem('deviceId', deviceId);
            }

            try {
                const res = await fetch(`${API_URL}/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, deviceId: deviceId })
                });
                const data = await res.json();
                if (data.valid) {
                    if (data.type === 'premium') {
                        alert('Premium key valid! Never expires.');
                    } else {
                        alert(`Key valid until: ${new Date(data.expiresAt).toLocaleString()}`);
                    }
                } else {
                    let msg = 'Invalid key';
                    if (data.reason === 'expired') msg = 'Key expired';
                    if (data.reason === 'wrong_device') msg = 'Key bound to different device';
                    alert(msg);
                }
            } catch(err) {
                alert('Cannot connect to server');
            }
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById('keyText').innerText);
            alert('Key copied');
        }

        document.getElementById('generateBtn').onclick = generateKey;
        document.getElementById('validateBtn').onclick = validateKey;

        updateCooldownDisplay();
        setInterval(updateCooldownDisplay, 1000);

        if (currentToken) {
            document.getElementById('generateBox').scrollIntoView();
        }
    </script>
</body>
</html>
