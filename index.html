<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sub {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .box {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .key-display {
            font-family: monospace;
            font-size: 18px;
            background: #0a0a0a;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            letter-spacing: 1px;
            color: #0f0;
            border: 1px solid #0f0;
            margin: 15px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .copy-btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .loading {
            background: rgba(255,255,0,0.1);
            color: #ff0;
        }
        .error {
            background: rgba(255,0,0,0.1);
            color: #f00;
        }
        .success {
            background: rgba(0,255,0,0.1);
            color: #0f0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin: 10px 0;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .small {
            font-size: 12px;
            color: #888;
        }
        hr {
            border-color: rgba(255,255,255,0.1);
            margin: 20px 0;
        }
        .key-info {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KEY SYSTEM</h1>
        <div class="sub">Get your license key</div>

        <div id="mainContent">
            <!-- Content loaded by JavaScript -->
        </div>
    </div>

    <script>
        // CONFIGURATION - CHANGE THIS TO YOUR RENDER API URL
        const API_URL = 'https://omega-key.onrender.com';
        
        // Get token from URL (if coming from renewal)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        let generatedKey = '';
        
        async function init() {
            const contentDiv = document.getElementById('mainContent');
            
            if (token) {
                showLoading(contentDiv, 'Generating your key...');
                await exchangeTokenForKey(token);
            } else {
                showMainMenu(contentDiv);
            }
        }
        
        function showMainMenu(div) {
            div.innerHTML = `
                <div class="box">
                    <p>Generate a new 6-hour key</p>
                    <button id="generateBtn">GENERATE NEW KEY</button>
                </div>
                <hr>
                <div class="box">
                    <p style="margin-bottom: 10px;">Already have a key?</p>
                    <input type="text" id="existingKey" placeholder="Paste your key here">
                    <button id="useExistingBtn">VALIDATE KEY</button>
                </div>
                <div class="footer">Normal keys expire after 6 hours. Premium keys never expire.</div>
            `;
            
            document.getElementById('generateBtn').addEventListener('click', () => {
                requestNewKey();
            });
            
            document.getElementById('useExistingBtn').addEventListener('click', () => {
                const key = document.getElementById('existingKey').value.trim();
                if (key) {
                    validateExistingKey(key);
                } else {
                    alert('Please paste a key');
                }
            });
        }
        
        function showLoading(div, message) {
            div.innerHTML = `
                <div class="box">
                    <div class="status loading">${message}</div>
                    <div style="text-align: center;">⏳ Processing...</div>
                </div>
            `;
        }
        
        function showKeyDisplay(div, key, expiresAt) {
            const expireDate = new Date(expiresAt).toLocaleString();
            div.innerHTML = `
                <div class="box">
                    <p>Your key has been generated.</p>
                    <div class="key-display" id="keyText">${key}</div>
                    <button id="copyBtn" class="copy-btn">COPY KEY</button>
                    <div class="key-info">Expires at: ${expireDate}</div>
                    <div class="key-info">Paste this key into Game Guardian.</div>
                    <hr>
                    <button id="backBtn">BACK TO MENU</button>
                </div>
            `;
            
            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(key);
                alert('Key copied to clipboard');
            });
            
            document.getElementById('backBtn').addEventListener('click', () => {
                showMainMenu(div);
            });
        }
        
        function showPremiumKeyDisplay(div, key) {
            div.innerHTML = `
                <div class="box">
                    <p>Premium key detected.</p>
                    <div class="key-display" id="keyText" style="border-color:#ff0; color:#ff0;">${key}</div>
                    <button id="copyBtn" class="copy-btn">COPY KEY</button>
                    <div class="key-info" style="color:#ff0;">This key NEVER expires.</div>
                    <hr>
                    <button id="backBtn">BACK TO MENU</button>
                </div>
            `;
            
            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(key);
                alert('Key copied to clipboard');
            });
            
            document.getElementById('backBtn').addEventListener('click', () => {
                showMainMenu(div);
            });
        }
        
        function showError(div, message) {
            div.innerHTML = `
                <div class="box">
                    <div class="status error">ERROR: ${message}</div>
                    <button id="backBtn">TRY AGAIN</button>
                </div>
            `;
            document.getElementById('backBtn').addEventListener('click', () => {
                showMainMenu(div);
            });
        }
        
        async function requestNewKey() {
            const contentDiv = document.getElementById('mainContent');
            showLoading(contentDiv, 'Requesting new key...');
            
            try {
                // Generate a device ID for this session
                let deviceId = localStorage.getItem('deviceId');
                if (!deviceId) {
                    deviceId = 'web_' + Math.random().toString(36).substr(2, 16) + Date.now();
                    localStorage.setItem('deviceId', deviceId);
                }
                
                // Request a token from API
                const response = await fetch(`${API_URL}/request-new-key-token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: deviceId })
                });
                
                if (!response.ok) {
                    throw new Error('Server error');
                }
                
                const data = await response.json();
                
                if (data.token) {
                    // Exchange the token for a key
                    await exchangeTokenForKey(data.token);
                } else {
                    throw new Error('Failed to get token');
                }
            } catch (error) {
                console.error(error);
                showError(contentDiv, 'Could not connect to server. Make sure your API is running.');
            }
        }
        
        async function exchangeTokenForKey(token) {
            const contentDiv = document.getElementById('mainContent');
            
            try {
                const response = await fetch(`${API_URL}/key?token=${token}`);
                
                if (!response.ok) {
                    throw new Error('Invalid or expired token');
                }
                
                const html = await response.text();
                
                // Parse the HTML response to extract key and expiry
                const keyMatch = html.match(/<code[^>]*>([^<]+)<\/code>/);
                const expiryMatch = html.match(/Expires at: ([^<]+)/);
                
                if (keyMatch) {
                    const newKey = keyMatch[1].trim();
                    const expiry = expiryMatch ? expiryMatch[1] : Date.now() + 6*60*60*1000;
                    showKeyDisplay(contentDiv, newKey, expiry);
                } else {
                    contentDiv.innerHTML = html;
                    // Add copy button if not present
                    const keyElement = document.querySelector('code');
                    if (keyElement && !document.getElementById('copyBtn')) {
                        const copyBtn = document.createElement('button');
                        copyBtn.textContent = 'COPY KEY';
                        copyBtn.className = 'copy-btn';
                        copyBtn.style.marginTop = '15px';
                        copyBtn.onclick = () => {
                            navigator.clipboard.writeText(keyElement.textContent);
                            alert('Key copied');
                        };
                        document.querySelector('.box').appendChild(copyBtn);
                    }
                }
            } catch (error) {
                console.error(error);
                showError(contentDiv, 'Invalid or expired link. Please go back and try again.');
            }
        }
        
        async function validateExistingKey(key) {
            const contentDiv = document.getElementById('mainContent');
            showLoading(contentDiv, 'Validating key...');
            
            try {
                let deviceId = localStorage.getItem('deviceId');
                if (!deviceId) {
                    deviceId = 'web_' + Math.random().toString(36).substr(2, 16);
                    localStorage.setItem('deviceId', deviceId);
                }
                
                const response = await fetch(`${API_URL}/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, deviceId: deviceId })
                });
                
                const data = await response.json();
                
                if (data.valid) {
                    if (data.type === 'premium') {
                        showPremiumKeyDisplay(contentDiv, key);
                    } else {
                        showKeyDisplay(contentDiv, key, data.expiresAt);
                    }
                } else {
                    let errorMsg = 'Invalid key. ';
                    if (data.reason === 'expired') errorMsg = 'This key has expired. Generate a new one.';
                    if (data.reason === 'wrong_device') errorMsg = 'This key is bound to another device.';
                    showError(contentDiv, errorMsg);
                }
            } catch (error) {
                console.error(error);
                showError(contentDiv, 'Could not connect to server.');
            }
        }
        
        // Start the app
        init();
    </script>
</body>
</html>
